name: Deploy app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          PUBLIC_URL: /Zerodha-clone
          REACT_APP_API_URL: https://zerodha-clone-backend-y5ud.onrender.com
          REACT_APP_DASHBOARD_URL: https://yogesh-naik2003.github.io/Zerodha-clone/dashboard/#/

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
        env:
          PUBLIC_URL: /Zerodha-clone/dashboard
          REACT_APP_API_URL: https://zerodha-clone-backend-y5ud.onrender.com
          REACT_APP_LOGIN_URL: https://yogesh-naik2003.github.io/Zerodha-clone/#/login

      - name: Combine Pages artifact
        run: |
          mkdir -p pages/dashboard
          cp -R frontend/build/. pages/
          cp -R dashboard/build/. pages/dashboard/
          cp pages/index.html pages/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
